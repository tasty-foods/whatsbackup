<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — WhatsBackUp</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110d" media="(prefers-color-scheme: dark)">
<!-- Self-contained by design: GitHub Pages serves this file for any missing URL
     at any depth, so a relative stylesheet would sometimes 404 as well and the
     visitor would meet unstyled text sitting on top of a broken link. -->
<style>
  :root {
    color-scheme: light dark;
    --paper:#f4f1e8; --paper-2:#ebe6d9; --ink:#16140e; --ink-2:#4b4536; --ink-3:#6d6551;
    --rule:#d3cbb6; --rule-2:#b9ae94; --accent:#a83518;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#13110d; --paper-2:#1a1712; --ink:#f2eee2; --ink-2:#b8ae99; --ink-3:#968c78;
            --rule:#302b22; --rule-2:#453e31; --accent:#e0714f; }
  }
  * { box-sizing:border-box }
  body {
    margin:0; min-height:100vh; display:grid; align-content:center;
    background:var(--paper); color:var(--ink); padding:8vh 7vw;
    font:400 17.5px/1.62 var(--serif);
  }
  .label { font-family:var(--mono); font-size:.69rem; letter-spacing:.19em; text-transform:uppercase; color:var(--accent); margin:0 0 1.6em }
  h1 { font-size:clamp(2.4rem,6vw,4rem); font-weight:400; letter-spacing:-.028em; line-height:1.04; margin:0 0 .35em; max-width:14ch }
  p.lede { font-size:clamp(1.08rem,1.9vw,1.32rem); color:var(--ink-2); max-width:38ch; margin:0 0 2em }
  .frames { display:flex; gap:7px; margin:0 0 2.4em }
  .fr { width:58px; height:58px; border:1px solid var(--rule-2) }
  .fr.gone { border-style:dashed; background:var(--paper-2); display:grid; place-items:center;
             font-family:var(--mono); font-size:.5rem; letter-spacing:.1em; color:var(--accent); text-transform:uppercase }
  a.btn {
    display:inline-flex; align-items:center; padding:13px 20px; font-family:var(--mono);
    font-size:.78rem; letter-spacing:.13em; text-transform:uppercase; text-decoration:none;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); margin-right:12px;
  }
  a.btn.ghost { background:transparent; color:var(--ink) }
  a.btn:hover { background:var(--accent); border-color:var(--accent); color:var(--paper) }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
</style>
</head>
<body>
<main>
  <p class="label">Error 404 — not in the catalogue</p>
  <div class="frames" aria-hidden="true">
    <div class="fr" style="background:#5c6b52"></div>
    <div class="fr" style="background:#7d6a54"></div>
    <div class="fr gone">missing</div>
    <div class="fr" style="background:#455566"></div>
  </div>
  <h1>This page is no longer available.</h1>
  <p class="lede">Which is, admittedly, a poor look for a site about not losing things. The page you wanted has moved or never existed.</p>
  <p>
    <a class="btn" href="https://whatsbackup.cc/">Back to the start</a>
    <a class="btn ghost" href="https://whatsbackup.cc/download.html">Download</a>
  </p>
</main>
</body>
</html>
